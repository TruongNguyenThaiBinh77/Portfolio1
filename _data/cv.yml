    As a young and passionate Software Engineer, I am constantly learning and challenging myself with the latest technologies. My strengths lie in strong logical thinking, building stable system architectures, and developing user-friendly interfaces. I am particularly passionate about optimizing application performance and researching Artificial Intelligence solutions to deliver the best user experience.
